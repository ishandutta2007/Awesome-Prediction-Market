<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes floatPillSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPillFast {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }
    @keyframes dashChart {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    .pulsing-orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseOrb 9s ease-in-out infinite alternate-reverse; transform-origin: 1000px 220px; }
    .floating-card-1 { animation: floatPillSlow 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatPillFast 5s ease-in-out infinite 1s; }
    .floating-card-3 { animation: floatPillSlow 7s ease-in-out infinite 2s; }
    .chart-line { stroke-dasharray: 1200; animation: dashChart 5s ease-out forwards; }
    .glow-overlay { animation: glowPulse 4s ease-in-out infinite; }
    .font-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Orbs (Deep Background) -->
  <circle cx="180" cy="90" r="220" fill="url(#orb-cyan)" class="pulsing-orb-1" />
  <circle cx="1020" cy="240" r="240" fill="url(#orb-purple)" class="pulsing-orb-2" />
  <circle cx="620" cy="320" r="200" fill="url(#orb-emerald)" class="glow-overlay" />

  <!-- Ambient Dynamic Market Chart (Mid-ground decorative lines) -->
  <g opacity="0.35">
    <!-- Secondary trend curve -->
    <path d="M 0 280 Q 200 210, 400 240 T 800 180 T 1200 130" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 6" />
    <!-- Primary dynamic probability wave -->
    <path class="chart-line" d="M 0 310 C 150 270, 280 330, 450 260 C 620 190, 750 240, 920 170 C 1040 120, 1120 150, 1200 100" fill="none" stroke="url(#accent-cyan)" stroke-width="3" filter="url(#glow-cyan)" />
    <!-- Gradient fill under chart -->
    <path d="M 0 310 C 150 270, 280 330, 450 260 C 620 190, 750 240, 920 170 C 1040 120, 1120 150, 1200 100 L 1200 360 L 0 360 Z" fill="url(#accent-cyan)" opacity="0.05" />
  </g>

  <!-- Floating Dynamic Event Market Chips (Sides, Mid-ground, strictly avoiding center title) -->
  <!-- Left Side Market Chip 1 -->
  <g class="floating-card-1" opacity="0.9">
    <rect x="35" y="45" width="170" height="52" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <circle cx="55" cy="71" r="5" fill="#10b981" filter="url(#glow-green)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="68" y="64" fill="#94a3b8" font-size="10" font-weight="600" class="font-main">BTC &gt; $100K</text>
    <text x="68" y="83" fill="#34d399" font-size="13" font-weight="bold" class="font-main">YES · 76% <tspan fill="#10b981" font-size="11">▲</tspan></text>
  </g>

  <!-- Left Side Market Chip 2 -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="45" y="225" width="180" height="52" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <circle cx="65" cy="251" r="5" fill="#00f2fe" filter="url(#glow-cyan)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="78" y="244" fill="#94a3b8" font-size="10" font-weight="600" class="font-main">FED RATE CUT NEXT MTG</text>
    <text x="78" y="263" fill="#38bdf8" font-size="13" font-weight="bold" class="font-main">84% PROBABILITY</text>
  </g>

  <!-- Right Side Market Chip 1 -->
  <g class="floating-card-3" opacity="0.9">
    <rect x="990" y="45" width="175" height="52" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <circle cx="1010" cy="71" r="5" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="1023" y="64" fill="#94a3b8" font-size="10" font-weight="600" class="font-main">GLOBAL VOLUME 24H</text>
    <text x="1023" y="83" fill="#fbbf24" font-size="13" font-weight="bold" class="font-main">$142.8M TRADED</text>
  </g>

  <!-- Right Side Market Chip 2 -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="985" y="225" width="180" height="52" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <circle cx="1005" cy="251" r="5" fill="#ec4899">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="1018" y="244" fill="#94a3b8" font-size="10" font-weight="600" class="font-main">ELECTION BETTING POOL</text>
    <text x="1018" y="263" fill="#f472b6" font-size="13" font-weight="bold" class="font-main">POLYMARKET CLOB</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Badges (Crisp, High Contrast, Centered) -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <g transform="translate(440, 38)">
      <rect width="320" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" />
      <text x="160" y="20" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-main">
        ⚡ THE CURATED ECOSYSTEM DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" fill="url(#text-grad)" font-size="46" font-weight="900" letter-spacing="-0.5" text-anchor="middle" class="font-main" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.8))">
      Awesome Prediction Market
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" fill="#94a3b8" font-size="16" font-weight="500" letter-spacing="0.2" text-anchor="middle" class="font-main">
      Event Contracts · Decentralized Forecasting · CLOB Order Books · Probability Pricing
    </text>

    <!-- Decorative separator line -->
    <line x1="420" y1="198" x2="780" y2="198" stroke="url(#accent-cyan)" stroke-width="1.5" opacity="0.6" />

    <!-- Feature Pillars / Bottom Badges -->
    <g transform="translate(250, 220)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="80" y="23" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" class="font-main">🏛️ SaaS Exchanges</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(180, 0)">
        <rect width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="80" y="23" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle" class="font-main">💻 Open Source SDKs</text>
      </g>
      <!-- Pill 3: CLOB & AMMs -->
      <g transform="translate(360, 0)">
        <rect width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="80" y="23" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle" class="font-main">⚡ CLOB &amp; AMM Pools</text>
      </g>
      <!-- Pill 4: AI Agents -->
      <g transform="translate(540, 0)">
        <rect width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="80" y="23" fill="#f472b6" font-size="12" font-weight="600" text-anchor="middle" class="font-main">🤖 AI Agent Tooling</text>
      </g>
    </g>

    <!-- Bottom tagline -->
    <text x="600" y="295" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle" class="font-main">
      Tracking Leading Platforms: Polymarket · Kalshi · Betfair · PredictIt · Drift · Manifold · Augur
    </text>
  </g>

  <!-- Border Highlight Outline -->
  <rect width="1198" height="358" x="1" y="1" fill="none" stroke="#334155" stroke-width="1" rx="16" opacity="0.5" />
</svg>
